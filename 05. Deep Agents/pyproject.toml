[project]
name = "05-deep-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saksham Jaiswal", email = "sakshamjaiswalofficial@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.13",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.3",
    "tavily>=1.1.0",
]

[project.scripts]
05-deep-agents = "05_deep_agents:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
